[build-system]
requires = ["setuptools>=65.0.0", "cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronosmatch"
version = "3.1.0"
description = "Zero-Copy High-Frequency Trading (HFT) Engine in Python & Cython"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cython>=3.0.0",
    "setuptools>=65.0.0",
    "websockets>=12.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pandas>=2.0.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
]
