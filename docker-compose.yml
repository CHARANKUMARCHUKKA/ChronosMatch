version: '3.8'

services:
  dashboard:
    build: .
    container_name: chronosmatch_dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  engine:
    build: .
    container_name: chronosmatch_engine
    command: ["python", "main.py", "--no-monitor"]
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

